name: Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-build.yml
      - cmake/**
      - examples/**
      - physica/**
      - CMakeLists.txt
      - VERSION
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDSS_VERSION: "0.8.0.10"
  CUDSS_SHA256: "66d085917ba2aba0c61dd0cfde0ae284df9813709f60c4cd215c47f8929eb780"

jobs:
  build:
    name: Windows, MSVC, CUDA
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CMake 4.4, CUDA 13.3, and cuDSS 0.8
        shell: pwsh
        run: |
          winget install --id Kitware.CMake --version 4.4.3 --exact --silent --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
          winget install --id Nvidia.CUDA --version 13.3 --exact --silent --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity

          $cudssArchiveName = "libcudss-windows-x86_64-${env:CUDSS_VERSION}_cuda13-archive"
          $cudssArchive = Join-Path $env:RUNNER_TEMP "$cudssArchiveName.zip"
          $cudssDirectory = Join-Path $env:RUNNER_TEMP "cudss"
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cudss/redist/libcudss/windows-x86_64/$cudssArchiveName.zip" -OutFile $cudssArchive
          if ((Get-FileHash -LiteralPath $cudssArchive -Algorithm SHA256).Hash -ne $env:CUDSS_SHA256) { throw "cuDSS archive checksum mismatch" }
          Expand-Archive -LiteralPath $cudssArchive -DestinationPath $cudssDirectory
          $cudssRoot = Join-Path $cudssDirectory $cudssArchiveName

          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $cudaRoot = Get-Item "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          "CUDA_PATH=$($cudaRoot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDACXX=$($cudaRoot.FullName)\bin\nvcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDSS_DIR=$(Join-Path $cudssRoot 'lib\cmake\cudss')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $cudaRoot.FullName "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $cudssRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Enter Visual Studio developer environment
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $developerCommand = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          cmd /d /s /c "`"$developerCommand`" -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release "-Dcudss_DIR=$env:CUDSS_DIR" -DPHYSICA_EXAMPLES=ON -DPHYSICA_BUILD_SPECTRA=OFF -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build cmake-build-release --parallel 30
